name: Publish v0.9.1 once

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  publish:
    if: github.event.issue.title == '[publish-v091]'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false

      - name: Verify source and build modern targets
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'const Version = "0.9.1"' internal/app/app.go
          node --check internal/webui/app.js
          go test ./...
          go vet ./...
          sh ./scripts/build-modern.sh
          gh issue comment "$ISSUE" --body '1/3 V0.9.1 源码、JavaScript、go test、go vet 与现代平台构建通过。' || true

      - uses: actions/setup-go@v5
        with:
          go-version: '1.20.14'
          cache: false

      - name: Verify Windows 7 builds
        shell: bash
        run: |
          set -euo pipefail
          go test ./...
          sh ./scripts/build-win7.sh
          gh issue comment "$ISSUE" --body '2/3 Go 1.20.14 测试与 Win7 x64/x86 构建通过。等待清理一次性发布器。' || true

      - name: Package assets
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          zip -9 lan-share-macos-intel.zip lan-share-macos-intel
          zip -9 lan-share-macos-apple-silicon.zip lan-share-macos-apple-silicon
          rm -f lan-share-macos-intel lan-share-macos-apple-silicon
          sha256sum * > SHA256SUMS.txt

      - name: Wait for clean main, tag and publish
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            git fetch origin main
            if git cat-file -e origin/main:.github/workflows/publish-v091-once.yml 2>/dev/null; then
              sleep 2
            else
              break
            fi
          done
          git fetch origin main
          if git cat-file -e origin/main:.github/workflows/publish-v091-once.yml 2>/dev/null; then
            echo 'temporary workflow was not cleaned in time' >&2
            exit 1
          fi
          CLEAN_SHA=$(git rev-parse origin/main)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a v0.9.1 "$CLEAN_SHA" -m 'LAN Share v0.9.1'
          git push origin refs/tags/v0.9.1
          gh release create v0.9.1 dist/* --verify-tag --title 'LAN Share v0.9.1' --notes 'V0.9.1 focuses on responsive UI polish: adaptive desktop/tablet/mobile layouts, reduced duplicated status information, unified component sizing and spacing, responsive file/transfer lists, and improved nearby-device/settings layouts. Transfer protocols and V0.9 core behavior are unchanged.'
          gh issue close "$ISSUE" --comment "3/3 LAN Share v0.9.1 已从干净 main 提交 ${CLEAN_SHA} 发布，跨平台资产已上传。" || true
