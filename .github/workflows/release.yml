name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup modern Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false

      - name: Test and vet
        run: |
          go test ./...
          go vet ./...
          if [ -f internal/webui/v07.js ]; then node --check internal/webui/v07.js; fi

      - name: Build modern targets
        run: sh ./scripts/build-modern.sh

      - name: Setup Go 1.20.14 for Windows 7
        uses: actions/setup-go@v5
        with:
          go-version: '1.20.14'
          cache: false

      - name: Build Windows 7 targets
        run: sh ./scripts/build-win7.sh

      - name: Package macOS assets and checksums
        run: |
          cd dist
          zip -9 lan-share-macos-intel.zip lan-share-macos-intel
          zip -9 lan-share-macos-apple-silicon.zip lan-share-macos-apple-silicon
          rm -f lan-share-macos-intel lan-share-macos-apple-silicon
          sha256sum * > SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --generate-notes --title "LAN Share ${TAG}"
          fi
