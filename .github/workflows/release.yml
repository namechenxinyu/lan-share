name: Release

on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare release shell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.7.0 >/dev/null 2>&1 || gh release create v0.7.0 --target main --title 'LAN Share v0.7.0' --notes 'LAN Share v0.7.0: LAN AirDrop, temporary share links with offline QR codes, Windows native tray, resumable large-file transfer, pairing and AES-256-GCM security.'
          gh issue comment 1 --body 'release diag A: shell ready.' || true

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false

      - name: Diagnose and build modern
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          report_fail() {
            local name="$1" file="$2"
            { echo "release diagnostic failed at: $name"; echo '```'; tail -n 80 "$file"; echo '```'; } > /tmp/issue.txt
            gh issue comment 1 --body-file /tmp/issue.txt || true
            exit 1
          }
          echo "$(go version)" > /tmp/go.log
          grep -q 'const Version = "0.7.0"' internal/app/app.go > /tmp/version.log 2>&1 || report_fail version /tmp/version.log
          node --check internal/webui/v07.js > /tmp/node.log 2>&1 || report_fail node-check /tmp/node.log
          gh issue comment 1 --body 'release diag B: version and JavaScript check passed.' || true
          go test ./... > /tmp/test.log 2>&1 || report_fail go-test /tmp/test.log
          gh issue comment 1 --body 'release diag C: go test passed.' || true
          go vet ./... > /tmp/vet.log 2>&1 || report_fail go-vet /tmp/vet.log
          gh issue comment 1 --body 'release diag D: go vet passed.' || true
          sh ./scripts/build-modern.sh > /tmp/build.log 2>&1 || report_fail modern-build /tmp/build.log
          gh issue comment 1 --body 'release diag E: modern builds passed.' || true

      - uses: actions/setup-go@v5
        with:
          go-version: '1.20.14'
          cache: false

      - name: Build Windows 7 targets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! sh ./scripts/build-win7.sh > /tmp/win7.log 2>&1; then
            { echo 'release diagnostic failed at: win7-build'; echo '```'; tail -n 80 /tmp/win7.log; echo '```'; } > /tmp/issue.txt
            gh issue comment 1 --body-file /tmp/issue.txt || true
            exit 1
          fi
          gh issue comment 1 --body 'release diag F: Win7 builds passed.' || true

      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cd dist
          zip -9 lan-share-macos-intel.zip lan-share-macos-intel
          zip -9 lan-share-macos-apple-silicon.zip lan-share-macos-apple-silicon
          rm -f lan-share-macos-intel lan-share-macos-apple-silicon
          sha256sum * > SHA256SUMS.txt
          cd ..
          gh release upload v0.7.0 dist/* --clobber
          gh issue close 1 --comment 'v0.7.0 release complete: all platform assets uploaded.' || true
