# trigger-v080: second push after main-branch trigger became active
name: Release V0.8 UI Redesign

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  publish-v080:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize and verify V0.8 UI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat .release-staging/v08/index.b64.* | tr -d '\n' | base64 -d > internal/webui/index.html
          echo 'aad5e68711127a4560355322ff8020f2bad8e24fb1ca81f0f0ddf27e3c6657fd  internal/webui/index.html' | sha256sum -c -
          test "$(wc -c < internal/webui/index.html)" -eq 27335
          sed -i 's/const Version = "0.7.0"/const Version = "0.8.0"/' internal/app/app.go
          grep -q 'const Version = "0.8.0"' internal/app/app.go
          python3 - <<'PY'
          from pathlib import Path
          import re
          readme = Path('README.md')
          s = readme.read_text(encoding='utf-8').replace('# LAN Share 0.7', '# LAN Share 0.8', 1)
          section = '''### V0.8 · User-first UI / 更简单的文件快传\n\n- 首页重构为任务流：**快速发送 / 附近设备 / 我的共享 / 最近活动**，打开即可知道下一步做什么。\n- 主界面隐藏 TCP/UDP、多 IP、架构等技术信息，统一收进“更多设置 → 网络与版本详情”。\n- 设备区卡片化，增加友好的空状态、重新扫描入口和手动 IP 连接入口。\n- 发送区突出“选设备 → 拖文件”，继续保留设备卡片直接拖拽发送的 LAN AirDrop 体验。\n- 共享目录成为一级信息：直接显示当前文件夹、文件数量和总大小；切换目录后已有文件无需重新上传。\n- 新增共享文件即时搜索，更方便在文件较多时快速定位。\n- 安全配对、设备名称、开机启动、临时分享链接统一收进折叠的“更多设置”，减少首页干扰。\n- 顶部状态改为用户语言：本机名称、主局域网地址、在线设备数、安全状态；不再默认展示全部虚拟网卡地址。\n- 保留 V0.7 的断点续传、大文件 Range、并行拉取、AES-256-GCM、二维码分享和 Windows 原生托盘，不改变核心传输协议。\n'''
          if '### V0.8 · User-first UI' not in s:
              s = s.replace('## 已实现\n', '## 已实现\n\n' + section + '\n', 1)
          readme.write_text(s, encoding='utf-8')
          changelog = Path('CHANGELOG.md')
          c = changelog.read_text(encoding='utf-8')
          entry = '''## 0.8.0\n\n- 重构首页信息架构，围绕“发送文件、发现设备、共享文件、查看传输”组织操作。\n- 新增现代化双栏主工作区、设备卡片、友好空状态和更清晰的传输反馈。\n- 共享目录提升为一级入口，显示文件数量/总大小；已有文件继续零复制直接共享。\n- 新增共享文件前端搜索和手动 IP 打开设备。\n- 技术网络信息、安全配对、启动项和临时分享下沉到折叠的更多设置。\n- 顶部状态改为用户语言，仅突出主要局域网地址、在线设备数和安全状态。\n- 保持 V0.7 传输协议和大文件性能路径不变。\n\n'''
          if '## 0.8.0' not in c:
              c = c.replace('# Changelog\n\n', '# Changelog\n\n' + entry, 1)
          changelog.write_text(c, encoding='utf-8')
          html = Path('internal/webui/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', html, re.S)
          if not scripts:
              raise SystemExit('V0.8 inline JavaScript missing')
          Path('/tmp/v08-inline.js').write_text(scripts[-1], encoding='utf-8')
          PY
          gh issue comment 3 --body 'V0.8 UI package reconstructed successfully and SHA256 verified.'

      - name: Setup Go 1.23.2
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false

      - name: Test, vet and build modern platforms
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node --check /tmp/v08-inline.js
          go test ./...
          go vet ./...
          sh ./scripts/build-modern.sh
          gh issue comment 3 --body 'V0.8 modern release gate passed: JavaScript syntax, go test, go vet, Win11/Linux/macOS builds.'

      - name: Setup Go 1.20.14 for Windows 7
        uses: actions/setup-go@v5
        with:
          go-version: '1.20.14'
          cache: false

      - name: Build Windows 7 targets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sh ./scripts/build-win7.sh
          gh issue comment 3 --body 'V0.8 Win7 compatibility gate passed: Go 1.20.14 x64/x86 builds succeeded.'

      - name: Restore reusable release workflow and commit V0.8
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .release-staging/v08
          rm -f .github/workflows/publish-v080.yml
          cat > .github/workflows/release.yml <<'YAML'
          name: Release

          on:
            push:
              tags:
                - 'v*'

          permissions:
            contents: write

          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                  with:
                    fetch-depth: 0
                - name: Setup modern Go
                  uses: actions/setup-go@v5
                  with:
                    go-version: '1.23.2'
                    cache: false
                - name: Test and vet
                  run: |
                    go test ./...
                    go vet ./...
                    if [ -f internal/webui/v07.js ]; then node --check internal/webui/v07.js; fi
                - name: Build modern targets
                  run: sh ./scripts/build-modern.sh
                - name: Setup Go 1.20.14 for Windows 7
                  uses: actions/setup-go@v5
                  with:
                    go-version: '1.20.14'
                    cache: false
                - name: Build Windows 7 targets
                  run: sh ./scripts/build-win7.sh
                - name: Package macOS assets and checksums
                  run: |
                    cd dist
                    zip -9 lan-share-macos-intel.zip lan-share-macos-intel
                    zip -9 lan-share-macos-apple-silicon.zip lan-share-macos-apple-silicon
                    rm -f lan-share-macos-intel lan-share-macos-apple-silicon
                    sha256sum * > SHA256SUMS.txt
                - name: Publish GitHub Release
                  env:
                    GH_TOKEN: ${{ github.token }}
                  run: |
                    TAG="${GITHUB_REF_NAME}"
                    if gh release view "$TAG" >/dev/null 2>&1; then
                      gh release upload "$TAG" dist/* --clobber
                    else
                      gh release create "$TAG" dist/* --verify-tag --generate-notes --title "LAN Share ${TAG}"
                    fi
          YAML
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: release LAN Share v0.8.0 user-first UI'
          git push origin HEAD:main
          git tag -a v0.8.0 -m 'LAN Share v0.8.0'
          git push origin v0.8.0
          gh issue comment 3 --body 'V0.8 source committed atomically and tag v0.8.0 created. Waiting for GitHub Release assets.'

      - name: Wait for Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            count=$(gh release view v0.8.0 --json assets --jq '.assets | length' 2>/dev/null || echo 0)
            if [ "$count" -ge 8 ]; then
              gh issue close 3 --comment "LAN Share v0.8.0 release complete: ${count} downloadable assets are ready."
              exit 0
            fi
            sleep 10
          done
          gh issue comment 3 --body 'V0.8 source/tag succeeded, but all Release assets were not visible within 10 minutes.'
          exit 1

      - name: Report V0.8 failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 3 --body "V0.8 publish failed. Workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
