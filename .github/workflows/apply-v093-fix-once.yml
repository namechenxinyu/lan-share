name: Apply v0.9.3 upload finalize fix once

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  patch:
    if: github.event.issue.title == '[apply-v093-upload-fix]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/v0.9.3-upload-finalize
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - name: Apply focused fix and tests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('internal/app/uploads.go')
          s = p.read_text()
          old = '''\tif _, err := os.OpenFile(path, os.O_CREATE|os.O_WRONLY, 0600); err != nil {\n\t\treturn nil, err\n\t}\n'''
          new = '''\tf, err := os.OpenFile(path, os.O_CREATE|os.O_WRONLY, 0600)\n\tif err != nil {\n\t\treturn nil, err\n\t}\n\tif err := f.Close(); err != nil {\n\t\treturn nil, err\n\t}\n'''
          if old not in s:
              raise SystemExit('expected initUpload OpenFile block not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('internal/app/app.go')
          s = p.read_text()
          if 'const Version = "0.9.2"' not in s:
              raise SystemExit('expected v0.9.2 version not found')
          p.write_text(s.replace('const Version = "0.9.2"', 'const Version = "0.9.3"', 1))

          p = Path('CHANGELOG.md')
          s = p.read_text()
          entry = '''## 0.9.3\n\n- 修复 Windows 下分块上传初始化阶段遗留未关闭文件句柄，导致完成上传时 `.part` 重命名失败的问题。\n- 修复连续本地上传与“附近设备”上传共同触发的 `The process cannot access the file because it is being used by another process`。\n- 新增 Windows 专用回归测试，验证 upload init 后临时文件可以立即 rename/finalize。\n- 保持 V0.9.2 的默认 HTTP 18888、UDP discovery 51889 及传输协议不变。\n\n'''
          if '## 0.9.3' not in s:
              s = s.replace('# Changelog\n\n', '# Changelog\n\n' + entry, 1)
          p.write_text(s)

          p = Path('README.md')
          s = p.read_text()
          s = s.replace('# LAN Share 0.9.2', '# LAN Share 0.9.3', 1)
          if '## V0.9.3 · Windows Upload Hotfix' not in s:
              marker = '\n## 核心能力\n'
              note = '''\n## V0.9.3 · Windows Upload Hotfix\n\n- 修复 Windows 下上传临时文件句柄未关闭，导致完成阶段 rename 失败。\n- 连续本机上传和附近设备上传使用同一修复路径。\n- 新增 Windows CI 回归测试，防止该类句柄问题再次出现。\n'''
              s = s.replace(marker, note + marker, 1)
          s = s.replace('正式 Tag（例如 `v0.9.2`）', '正式 Tag（例如 `v0.9.3`）')
          p.write_text(s)
          PY

          cat > internal/app/uploads_windows_test.go <<'EOF'
          //go:build windows

          package app

          import (
              "os"
              "path/filepath"
              "testing"
          )

          func TestInitUploadClosesPartialFileBeforeFinalize(t *testing.T) {
              dir := t.TempDir()
              a := &App{shareDir: dir, sessions: make(map[string]*uploadSession)}

              cases := []struct {
                  id   string
                  name string
              }{
                  {id: "windows-upload-001", name: "first.bin"},
                  {id: "windows-upload-002", name: "second.bin"},
              }

              for _, tc := range cases {
                  s, err := a.initUpload(uploadInitRequest{ID: tc.id, Name: tc.name, Size: 0}, "")
                  if err != nil {
                      t.Fatalf("initUpload(%s): %v", tc.id, err)
                  }
                  final := filepath.Join(dir, tc.name)
                  if err := os.Rename(s.Path, final); err != nil {
                      t.Fatalf("rename partial upload after init (%s): %v", tc.id, err)
                  }
                  a.deleteSession(tc.id)
                  if _, err := os.Stat(final); err != nil {
                      t.Fatalf("final file missing after rename (%s): %v", tc.id, err)
                  }
              }
          }
          EOF

          gofmt -w internal/app/uploads.go internal/app/uploads_windows_test.go internal/app/app.go
          git diff --check
          go test ./...
          go vet ./...

      - name: Commit hotfix branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/app/uploads.go internal/app/uploads_windows_test.go internal/app/app.go README.md CHANGELOG.md
          git commit -m "fix: close upload temp handle before Windows finalize"
          git push origin HEAD:hotfix/v0.9.3-upload-finalize

      - name: Report
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment ${{ github.event.issue.number }} --body "V0.9.3 上传 finalize 修复已应用到 hotfix/v0.9.3-upload-finalize，并通过 Linux go test/go vet。"
