name: Apply LAN Share v0.7

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v07.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true
      - name: Materialize v0.7 blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request
          files = {
            'c4a7b90d9eec4752ac9b391b369a3e00d345df93': 'README.md',
            'f43f7db4051f8fd16519697ddd618b8d084afe2d': 'CHANGELOG.md',
            '4ad7c9cc907b08ed1f6c74675d8a91e3f0b0cd86': 'cmd/lan-share/main.go',
            '8b6bbcee6746ac25e1a7a629a7e0dcc526c37ee0': 'docs/architecture.md',
            '459b66db1655a0fdd137b66dd0872051a3db1822': 'docs/protocol.md',
            '30d4d9e36c44616f015ff3d1a14f9bfbb648c113': 'internal/app/app.go',
            'aca96b458b04f4de613e88a5c3ebca05f427e692': 'internal/app/sharelinks.go',
            '2e9ce4ceabef93aafb18db63f6cf9992425b4ade': 'internal/app/sharelinks_test.go',
            'a16e72b84fd2c33edf6822fdf4b30f9b828359ba': 'internal/config/config.go',
            '590fe11c899e6ef1452bfe3d0811c175b58cbff3': 'internal/discovery/discovery.go',
            '3d599390d2fb47db3b36cb002d3b1e3bc575697f': 'internal/platform/tray_stub.go',
            'a4f2f4120582e8a864190a27ead3182fbcbb2a05': 'internal/platform/tray_windows.go',
            '115488f2e6c56f966d1354be0946aabf097e4c47': 'internal/qrcode/qrcode.go',
            '362ed9d7e9af70912958f8d6c1e4afd697a79f1f': 'internal/qrcode/qrcode_test.go',
            'd21d353ad61ec63d5b274dff30920b52a25f3823': 'internal/webui/index.html',
            '4a041240695e416e9d00c813d4700890a1482640': 'internal/webui/style.css',
            '249b4b9c03db48ac1dde0ccf53a2a5632e19aedb': 'internal/webui/v07.js',
            'e8e248fd541927b8a556d0fbe4c666fbdf6024c9': 'internal/webui/web.go',
          }
          token = os.environ['GH_TOKEN']
          repo = os.environ['GITHUB_REPOSITORY']
          for sha, path in files.items():
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/git/blobs/{sha}',
                  headers={'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github+json'},
              )
              with urllib.request.urlopen(req) as resp:
                  obj = json.load(resp)
              data = base64.b64decode(obj['content'])
              os.makedirs(os.path.dirname(path) or '.', exist_ok=True)
              with open(path, 'wb') as f:
                  f.write(data)
              print(path, sha)
          PY
      - name: Verify v0.7
        run: |
          grep -q 'const Version = "0.7.0"' internal/app/app.go
          node --check internal/webui/v07.js
          go test ./...
          go test -race ./...
          go vet ./...
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -o /tmp/lan-share-win64.exe ./cmd/lan-share
          CGO_ENABLED=0 GOOS=windows GOARCH=386 go build -trimpath -o /tmp/lan-share-win32.exe ./cmd/lan-share
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o /tmp/lan-share-linux ./cmd/lan-share
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -o /tmp/lan-share-macos-intel ./cmd/lan-share
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -o /tmp/lan-share-macos-arm64 ./cmd/lan-share
      - name: Commit v0.7 and tag v0.7.0
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md CHANGELOG.md cmd docs internal
          if ! git diff --cached --quiet; then
            git commit -m 'feat: release LAN Share v0.7'
            git push origin HEAD:main
          fi
          git fetch origin main --tags
          git reset --hard origin/main
          if ! git rev-parse v0.7.0 >/dev/null 2>&1; then
            git tag -a v0.7.0 -m 'LAN Share v0.7.0'
            git push origin v0.7.0
          fi
