name: Apply LAN Share v0.7

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v07.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true
      - name: Materialize v0.7 blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request
          files = {
            '17ea946170341bb2ba5389ae1878b89e6f719dd4': 'README.md',
            '06932945473d3ff8f46cadf6224f42ac6e84ced0': 'CHANGELOG.md',
            '2c9372991779917073d149391ddd129701daad0d': 'cmd/lan-share/main.go',
            '8f5ef76047a37629ced215272284281f8fb96c74': 'docs/architecture.md',
            'b237ad9c99b2fbd5203b458d5e3c88afb7c3d6d1': 'docs/protocol.md',
            '43c9ef1e544eff9ba365078a1ec8bed3aa214144': 'internal/app/app.go',
            '20ce4abaf5de883576793010ddf868e460e38a2b': 'internal/app/sharelinks.go',
            '843a66f33c7b045432476f20b8cd411fa17b7a07': 'internal/app/sharelinks_test.go',
            '4c8b83866e7fecea8c81aaea32b4dea9c4db08c9': 'internal/config/config.go',
            'a7b6c0020851f52fa77fba43e1cc366c0a047963': 'internal/discovery/discovery.go',
            '057444f29ea1d3ec902abe644bf70bf1753f8aac': 'internal/platform/tray_stub.go',
            '92e6c81675dcc0f4ba41ce7aeb4668f1b377c54e': 'internal/platform/tray_windows.go',
            '746ddae442d0f1b4b41471c96f0d31382452947f': 'internal/qrcode/qrcode.go',
            '582b4da1513bd5c0b815a69fb100bfda57e419f9': 'internal/qrcode/qrcode_test.go',
            '3b2396be1215653b3fe74387b2098b79e90a1902': 'internal/webui/index.html',
            '67c19e4a0f7d308071972bb757381357a4bd89ba': 'internal/webui/style.css',
            '1d769bb8c004de56955aeb4decd4b916e7d2ecbf': 'internal/webui/v07.js',
            '363260db599908abb71370243ec561776277c636': 'internal/webui/web.go',
          }
          token = os.environ['GH_TOKEN']
          repo = os.environ['GITHUB_REPOSITORY']
          for sha, path in files.items():
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/git/blobs/{sha}',
                  headers={'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github+json'},
              )
              with urllib.request.urlopen(req) as resp:
                  obj = json.load(resp)
              data = base64.b64decode(obj['content'])
              os.makedirs(os.path.dirname(path) or '.', exist_ok=True)
              with open(path, 'wb') as f:
                  f.write(data)
              print(path, sha)
          PY
      - name: Verify v0.7
        run: |
          node --check internal/webui/v07.js
          go test ./...
          go test -race ./...
          go vet ./...
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -o /tmp/lan-share-win64.exe ./cmd/lan-share
          CGO_ENABLED=0 GOOS=windows GOARCH=386 go build -trimpath -o /tmp/lan-share-win32.exe ./cmd/lan-share
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o /tmp/lan-share-linux ./cmd/lan-share
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -o /tmp/lan-share-macos-intel ./cmd/lan-share
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -o /tmp/lan-share-macos-arm64 ./cmd/lan-share
      - name: Commit v0.7
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md CHANGELOG.md cmd docs internal
          if git diff --cached --quiet; then
            echo 'v0.7 already applied'
            exit 0
          fi
          git commit -m 'feat: release LAN Share v0.7'
          git push origin HEAD:main
