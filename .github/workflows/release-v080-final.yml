name: Final LAN Share v0.8.0 Release

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  release:
    if: github.event.issue.title == '[release-v080-final]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout clean V0.8 source
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA=2ad784b469dc0863d0fc7de5260cf72d8fa502c3
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          git checkout --detach "$SOURCE_SHA"
          grep -q 'const Version = "0.8.0"' internal/app/app.go
          grep -q '快速发送' internal/webui/index.html
          grep -q '附近设备' internal/webui/index.html
          grep -q '我的共享' internal/webui/index.html
          grep -q '更多设置' internal/webui/index.html
          gh issue comment "$ISSUE" --body "1/4 已锁定干净 V0.8 源码：$SOURCE_SHA" || true

      - name: Setup Go 1.23.2
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false

      - name: Verify and build modern platforms
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('internal/webui/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', html, re.S)
          Path('/tmp/v08-inline.js').write_text(scripts[-1], encoding='utf-8')
          PY
          node --check /tmp/v08-inline.js
          go test ./...
          go test -race ./...
          go vet ./...
          sh ./scripts/build-modern.sh
          gh issue comment "$ISSUE" --body '2/4 JS、go test、race、vet、Win11/Linux/macOS 构建通过。' || true

      - name: Setup Go 1.20.14 for Windows 7
        uses: actions/setup-go@v5
        with:
          go-version: '1.20.14'
          cache: false

      - name: Build Win7 and package assets
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          sh ./scripts/build-win7.sh
          cd dist
          zip -9 lan-share-macos-intel.zip lan-share-macos-intel
          zip -9 lan-share-macos-apple-silicon.zip lan-share-macos-apple-silicon
          rm -f lan-share-macos-intel lan-share-macos-apple-silicon
          sha256sum * > SHA256SUMS.txt
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 8
          cd ..
          gh issue comment "$ISSUE" --body '3/4 Win7 x64/x86 与全部 Release 资产打包完成。' || true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          published=0
          for try in 1 2 3 4; do
            if gh release view v0.8.0 >/dev/null 2>&1; then
              if gh release upload v0.8.0 dist/* --clobber; then published=1; break; fi
            else
              if gh release create v0.8.0 dist/* --target "$SOURCE_SHA" --title 'LAN Share v0.8.0' --notes 'V0.8 focuses on user-first UI/UX: fast send, nearby devices, shared files, recent activity, simpler settings, while retaining resumable large-file transfer and security features.'; then published=1; break; fi
            fi
            sleep 5
          done
          test "$published" -eq 1
          count=$(gh release view v0.8.0 --json assets --jq '.assets | length')
          test "$count" -ge 8
          gh issue close "$ISSUE" --comment "4/4 LAN Share v0.8.0 发布完成，共 ${count} 个下载资产。" || true

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: gh issue comment "$ISSUE" --body "V0.8 最终发布失败，请查看：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" || true
