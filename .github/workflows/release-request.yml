name: Release Request

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

jobs:
  publish-v070:
    if: github.event.issue.title == '[release] v0.7.0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release shell first
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.7.0 >/dev/null 2>&1; then
            echo 'v0.7.0 release already exists'
          else
            gh release create v0.7.0 --target main --title 'LAN Share v0.7.0' --notes 'LAN Share v0.7.0: LAN AirDrop drag-and-drop, temporary share links with offline QR codes, Windows native tray, resumable large-file transfer, pairing and AES-256-GCM security.'
          fi

      - name: Setup modern Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Verify source
        run: |
          grep -q 'const Version = "0.7.0"' internal/app/app.go
          node --check internal/webui/v07.js
          go test ./...
          go vet ./...

      - name: Build modern targets
        run: ./scripts/build-modern.sh

      - name: Setup Go 1.20.14 for Windows 7
        uses: actions/setup-go@v5
        with:
          go-version: '1.20.14'
          cache: false

      - name: Build Windows 7 targets
        run: ./scripts/build-win7.sh

      - name: Package assets
        run: |
          cd dist
          zip -9 lan-share-macos-intel.zip lan-share-macos-intel
          zip -9 lan-share-macos-apple-silicon.zip lan-share-macos-apple-silicon
          rm -f lan-share-macos-intel lan-share-macos-apple-silicon
          sha256sum * > SHA256SUMS.txt

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v0.7.0 dist/* --clobber

      - name: Close successful request
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close ${{ github.event.issue.number }} --comment 'v0.7.0 release published with all build assets.'

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment ${{ github.event.issue.number }} --body 'v0.7.0 release shell was requested, but one of the build/upload steps failed. Check the Release Request workflow run for the failing step.'
