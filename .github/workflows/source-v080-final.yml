name: LAN Share V0.8 Final Source
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
jobs:
  source:
    if: github.event.issue.title == '[source-v080-final]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize source
        run: |
          set -e
          cat .release-staging/v08/index.b64.* | tr -d '\n' | base64 -d > internal/webui/index.html
          echo 'aad5e68711127a4560355322ff8020f2bad8e24fb1ca81f0f0ddf27e3c6657fd  internal/webui/index.html' | sha256sum -c -
          sed -i 's/const Version = "0.7.0"/const Version = "0.8.0"/' internal/app/app.go
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('README.md'); s=p.read_text(encoding='utf-8').replace('# LAN Share 0.7','# LAN Share 0.8',1)
          sec='''### V0.8 · User-first UI / 更简单的文件快传\n\n- 首页重构为任务流：**快速发送 / 附近设备 / 我的共享 / 最近活动**，打开即可知道下一步做什么。\n- 主界面隐藏 TCP/UDP、多 IP、架构等技术信息，统一收进“更多设置 → 网络与版本详情”。\n- 设备区卡片化，增加友好的空状态、重新扫描入口和手动 IP 连接入口。\n- 发送区突出“选设备 → 拖文件”，继续保留设备卡片直接拖拽发送的 LAN AirDrop 体验。\n- 共享目录成为一级信息：直接显示当前文件夹、文件数量和总大小；切换目录后已有文件无需重新上传。\n- 新增共享文件即时搜索，更方便在文件较多时快速定位。\n- 安全配对、设备名称、开机启动、临时分享链接统一收进折叠的“更多设置”，减少首页干扰。\n- 顶部状态改为用户语言：本机名称、主局域网地址、在线设备数、安全状态；不再默认展示全部虚拟网卡地址。\n- 保留 V0.7 的断点续传、大文件 Range、并行拉取、AES-256-GCM、二维码分享和 Windows 原生托盘，不改变核心传输协议。\n'''
          if '### V0.8 · User-first UI' not in s: s=s.replace('## 已实现\n','## 已实现\n\n'+sec+'\n',1)
          p.write_text(s,encoding='utf-8')
          p=Path('CHANGELOG.md'); c=p.read_text(encoding='utf-8')
          entry='''## 0.8.0\n\n- 重构首页信息架构，围绕“发送文件、发现设备、共享文件、查看传输”组织操作。\n- 新增现代化双栏主工作区、设备卡片、友好空状态和更清晰的传输反馈。\n- 共享目录提升为一级入口，显示文件数量/总大小；已有文件继续零复制直接共享。\n- 新增共享文件前端搜索和手动 IP 打开设备。\n- 技术网络信息、安全配对、启动项和临时分享下沉到折叠的更多设置。\n- 顶部状态改为用户语言，仅突出主要局域网地址、在线设备数和安全状态。\n- 保持 V0.7 传输协议和大文件性能路径不变。\n\n'''
          if '## 0.8.0' not in c: c=c.replace('# Changelog\n\n','# Changelog\n\n'+entry,1)
          p.write_text(c,encoding='utf-8')
          html=Path('internal/webui/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',html,re.S)
          Path('/tmp/v08-inline.js').write_text(scripts[-1],encoding='utf-8')
          PY
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - name: Verify and push product source
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          node --check /tmp/v08-inline.js
          go test ./...
          go vet ./...
          grep -q 'const Version = "0.8.0"' internal/app/app.go
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/webui/index.html internal/app/app.go README.md CHANGELOG.md
          git commit -m 'feat: LAN Share v0.8.0 user-first UI'
          git push origin HEAD:main
          gh issue close "$ISSUE" --comment 'V0.8.0 产品源码已验证并推送 main。' || true
