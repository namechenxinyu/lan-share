name: Trigger Check
on:
  issues:
    types: [opened]
permissions:
  issues: write
jobs:
  check:
    if: github.event.issue.title == '[trigger-check]'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body 'trigger-ok'
