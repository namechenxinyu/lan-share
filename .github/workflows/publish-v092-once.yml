name: Publish v0.9.2 once

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  publish:
    if: github.event.issue.title == '[publish-v092]'
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: 1fc314403150b107abc9f9d49bd678ced9cd2635
      TAG: v0.9.2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1fc314403150b107abc9f9d49bd678ced9cd2635
          fetch-depth: 0

      - name: Setup modern Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false

      - name: Verify source and modern targets
        run: |
          grep -q 'const Version = "0.9.2"' internal/app/app.go
          grep -Eq 'DefaultHTTPPort[[:space:]]*=[[:space:]]*18888' internal/config/config.go
          grep -Eq 'DefaultDiscoveryPort[[:space:]]*=[[:space:]]*51889' internal/config/config.go
          if [ -f internal/webui/app.js ]; then node --check internal/webui/app.js; fi
          if [ -f internal/webui/v07.js ]; then node --check internal/webui/v07.js; fi
          go test ./...
          go vet ./...
          sh ./scripts/build-modern.sh

      - name: Report modern gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "${{ github.event.issue.number }}" --body "1/3 V0.9.2 源码、JavaScript、go test、go vet 与现代平台构建通过。"

      - name: Setup Go 1.20.14 for Windows 7
        uses: actions/setup-go@v5
        with:
          go-version: '1.20.14'
          cache: false

      - name: Verify Go 1.20 and Win7 targets
        run: |
          go test ./...
          go vet ./...
          sh ./scripts/build-win7.sh

      - name: Report Win7 gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "${{ github.event.issue.number }}" --body "2/3 Go 1.20.14 测试、vet 与 Win7 x64/x86 构建通过。"

      - name: Package assets
        run: |
          cd dist
          zip -9 lan-share-macos-intel.zip lan-share-macos-intel
          zip -9 lan-share-macos-apple-silicon.zip lan-share-macos-apple-silicon
          rm -f lan-share-macos-intel lan-share-macos-apple-silicon
          sha256sum * > SHA256SUMS.txt

      - name: Create clean tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1 || gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG" "$TARGET_SHA"
          git push origin "$TAG"
          gh release create "$TAG" dist/* --verify-tag --generate-notes --title "LAN Share ${TAG}"
          gh issue comment "${{ github.event.issue.number }}" --body "3/3 LAN Share v0.9.2 已从干净 main 提交 ${TARGET_SHA} 发布，跨平台资产已上传。"
          gh issue close "${{ github.event.issue.number }}" --reason completed
